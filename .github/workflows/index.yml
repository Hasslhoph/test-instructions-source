name: Index Instructions

on:
  push:
    paths:
      - '**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Install opencode
        run: |
          curl -sL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mkdir -p ~/.opencode/bin
          mv /tmp/opencode ~/.opencode/bin/opencode
          chmod +x ~/.opencode/bin/opencode
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH

      - name: Index new instructions
        run: |
          set -e
          VAULT="${{ github.workspace }}/vault"
          SOURCE="${{ github.workspace }}/source"
          TODAY=$(date +%Y-%m-%d)

          for md in $(find "$SOURCE" -name '*.md' -not -path '*/.git/*' | head -5); do
            basename=$(basename "$md")

            # Check if already in vault
            if ls "$VAULT/Instructions/"*"$basename" 1>/dev/null 2>&1; then
              echo "Skip $basename (exists)"
              continue
            fi
            if [ -z "$basename" ]; then
              continue
            fi

            echo "=== Index: $basename ==="
            cp "$md" "$VAULT/$basename"

            # Build prompt with the file as the message
            PROMPT="You are an Obsidian vault indexer. Index FILE_NAME. Determine the module. Check Instructions/ for existing files with same topic — if found, merge/update; if not, create new. Filename: Instructions/{Module} - {Topic}.md. Frontmatter: title, module, type: instruction, version, created: $TODAY, updated: $TODAY, tags, related. Body sections: Описание, Ключевые функции, Предусловия, Шаги, Ожидаемый результат, Граничные случаи, Связанные документы. After creating: update MOC - Инструкции.md and Modules/Module - {Name}.md with wikilinks. Write in Russian."

            # Replace FILE_NAME placeholder with actual filename
            PROMPT="${PROMPT/FILE_NAME/$basename}"

            opencode run "$PROMPT" \
              --dir "$VAULT" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              2>&1 || echo "FAILED: $basename"

            rm -f "$VAULT/$basename"
          done

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index new instructions"
            git push
            echo "Pushed to knowledge base"
          fi
