name: Index Instructions

on:
  push:
    branches: [main]
    paths: ['**/*.md']

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup
        run: |
          npm install -g @opencode-ai/cli
          mkdir -p ~/.config/opencode/agent
          cp "$GITHUB_WORKSPACE/vault/.opencode/agent/obsidian-indexer.md" ~/.config/opencode/agent/
          sed -i "s|/Users/.*/Documents/Obsidian|$GITHUB_WORKSPACE/vault|g" ~/.config/opencode/agent/obsidian-indexer.md
          mkdir -p ~/.local/share/opencode
          printf '{"opencode-go":{"type":"api","key":"%s"}}\n' "${{ secrets.OPENCODE_GO_KEY }}" > ~/.local/share/opencode/auth.json

      - name: Index new files
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/source"
          git fetch origin main --depth=2
          NEW=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '*.md' || true)
          
          if [ -z "$NEW" ]; then
            echo "No new files to index"
            exit 0
          fi
          
          for file in $NEW; do
            full="$GITHUB_WORKSPACE/source/$file"
            [ -f "$full" ] || continue
            echo "=== Indexing: $file ==="
            
            opencode run --pure \
              --file "$full" \
              --dir "$GITHUB_WORKSPACE/vault" \
              --dangerously-skip-permissions \
              --model opencode/deepseek-v4-flash-free \
              "@obsidian-indexer Create instruction file in vault/Instructions/ with frontmatter, wikilinks" \
              2>&1
            rc=$?
            echo "Exit code: $rc"
            if [ $rc -ne 0 ]; then
              echo "OpenCode failed. Continuing anyway..."
            fi
          done

      - name: Commit & push
        run: |
          cd "$GITHUB_WORKSPACE/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index new instructions"
            git push
          else
            echo "No changes"
          fi
