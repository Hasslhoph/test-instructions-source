name: Index Instructions

on:
  push:
    branches: [main]
    paths: ['**/*.md', '.github/workflows/*']

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify vault agents exist
        run: |
          ls -la "$GITHUB_WORKSPACE/vault/.opencode/agent/"*
          echo "OK: agents found"

      - name: Setup agent config
        run: |
          mkdir -p ~/.config/opencode/agent
          cp "$GITHUB_WORKSPACE/vault/.opencode/agent/obsidian-indexer.md" ~/.config/opencode/agent/
          sed -i "s|/Users/.*/Documents/Obsidian|$GITHUB_WORKSPACE/vault|g" ~/.config/opencode/agent/obsidian-indexer.md
          echo "OK: agent configured"

      - name: Setup opencode auth and install
        run: |
          mkdir -p ~/.local/share/opencode
          printf '{"opencode-go":{"type":"api","key":"%s"}}\n' "${{ secrets.OPENCODE_GO_KEY }}" > ~/.local/share/opencode/auth.json
          echo "OK: auth configured"

      - name: Install opencode
        run: |
          npm install -g @opencode-ai/cli 2>&1 | tail -20
          echo "---INSTALL DONE---"
          command -v opencode && opencode --version || echo "opencode not in PATH"
          npx --yes @opencode-ai/cli --version 2>&1 || echo "npx also failed"
          echo "OK"

      - name: Detect new files
        id: detect
        run: |
          cd "$GITHUB_WORKSPACE/source"
          git fetch origin main --depth=2
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.md' || true)
          echo "changed<<EOF" >> $GITHUB_ENV
          echo "$FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Index via obsidian-indexer
        if: env.changed != ''
        run: |
          for file in ${{ env.changed }}; do
            full_path="$GITHUB_WORKSPACE/source/$file"
            [ -f "$full_path" ] || continue
            echo "=== Indexing: $file ==="
            npx --yes @opencode-ai/cli run \
              --agent obsidian-indexer \
              --file "$full_path" \
              --dir "$GITHUB_WORKSPACE/vault" \
              --dangerously-skip-permissions \
              --model opencode/deepseek-v4-flash-free \
              "Create instruction file in $GITHUB_WORKSPACE/vault/Instructions/ with frontmatter, wikilinks. Update MOC and module file."
          done

      - name: Commit and push
        if: env.changed != ''
        run: |
          cd "$GITHUB_WORKSPACE/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index: new instructions from Яна"
            git push
            echo "Pushed"
          else
            echo "No changes"
          fi
