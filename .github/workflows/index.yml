name: Index Instructions

on:
  push:
    branches: [main]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install opencode
        run: npm install -g @opencode-ai/cli && echo "OK: installed"

      - name: Config agent
        run: |
          mkdir -p ~/.config/opencode/agent
          cp -v "$GITHUB_WORKSPACE/vault/.opencode/agent/obsidian-indexer.md" ~/.config/opencode/agent/
          sed -i "s|/Users/.*/Documents/Obsidian|$GITHUB_WORKSPACE/vault|g" ~/.config/opencode/agent/obsidian-indexer.md
          echo "OK: agent configured"

      - name: Config auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {
            "opencode-go": {
              "type": "api",
              "key": "${{ secrets.OPENCODE_GO_KEY }}"
            }
          }
          ENDAUTH
          echo "OK: auth configured"

      - name: Index
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/source"
          git fetch origin main --depth=2
          NEW=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.md' || true)
          if [ -z "$NEW" ]; then echo "No new files"; exit 0; fi
          for file in $NEW; do
            full="$GITHUB_WORKSPACE/source/$file"
            [ -f "$full" ] || continue
            echo "Indexing: $file"
            opencode run --pure \
              --file "$full" \
              --dir "$GITHUB_WORKSPACE/vault" \
              --dangerously-skip-permissions \
              --model opencode/deepseek-v4-flash-free \
              "@obsidian-indexer Create instruction in vault/Instructions/" 2>&1
            echo "Exit: $?"
          done

      - name: Push
        run: |
          cd "$GITHUB_WORKSPACE/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index"; git push; echo "Pushed"
          else
            echo "No changes"
          fi
