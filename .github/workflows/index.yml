name: Index Instructions

on:
  push:
    branches: [main]
    paths: ['**/*.md']

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (Яна's instructions)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout knowledge base vault
        uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run indexer script
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          SOURCE_PATH: ${{ github.workspace }}/source
        run: python3 ${{ github.workspace }}/source/indexer.py

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index instructions from source"
            git push
            echo "✅ Pushed to knowledge base"
          else
            echo "ℹ️ No changes to commit"
          fi
