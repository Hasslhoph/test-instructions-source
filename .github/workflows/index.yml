name: Index Instructions

on:
  push:
    paths:
      - '**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Install opencode
        run: |
          mkdir -p ~/.opencode/bin
          curl -sL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mv /tmp/opencode ~/.opencode/bin/opencode
          chmod +x ~/.opencode/bin/opencode
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH
          export PATH="$HOME/.opencode/bin:$PATH"
          which opencode
          opencode --version

      - name: Auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH

      - name: Index
        run: |
          set -euo pipefail
          VAULT="${{ github.workspace }}/vault"
          SOURCE="${{ github.workspace }}/source"
          cd "$SOURCE"

          # Get only .md files changed in this push
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 -- '*.md' || true)
          else
            # First commit: process all .md files
            CHANGED=$(git ls-files '*.md')
          fi

          if [ -z "$CHANGED" ]; then
            echo "No .md files changed"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          while IFS= read -r md; do
            [ -z "$md" ] && continue
            basename=$(basename "$md")

            echo "=== Index: $basename ==="
            cp "$md" "$VAULT/$basename"

            opencode run "Index this instruction file in Obsidian vault. Compare with existing files in Instructions/. If a file with same topic already exists — UPDATE it with new content. If it does NOT exist — CREATE it. Always add proper frontmatter. Update MOC - Инструкции.md and Modules/Module - *.md with wikilinks. Write in Russian. The file to index is: $basename" \
              --dir "$VAULT" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              2>&1 \
              || echo "FAILED: $basename"

            rm -f "$VAULT/$basename"
          done <<< "$CHANGED"

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-index new instructions"
            git push
            echo "Pushed"
          fi
