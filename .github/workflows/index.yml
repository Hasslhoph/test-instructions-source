name: Index Instructions

on:
  push:
    paths:
      - '**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Install opencode
        run: |
          curl -sL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mkdir -p ~/.opencode/bin
          mv /tmp/opencode ~/.opencode/bin/opencode
          chmod +x ~/.opencode/bin/opencode
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH

      - name: Index new instructions
        run: |
          set -e
          VAULT="${{ github.workspace }}/vault"
          SOURCE="${{ github.workspace }}/source"
          TODAY=$(date +%Y-%m-%d)

          for md in $(find "$SOURCE" -name '*.md' -not -path '*/.git/*' | head -5); do
            basename=$(basename "$md")

            if ls "$VAULT/Instructions/"*"$basename" 1>/dev/null 2>&1; then
              echo "Skip $basename (exists)"
              continue
            fi
            if [ -z "$basename" ]; then
              continue
            fi

            echo "=== Index: $basename ==="
            cp "$md" "$VAULT/$basename"

            PROMPT="You are an Obsidian vault indexer. Index the file $basename.

## Purpose
Create and maintain a knowledge base (RAG) in Obsidian from iThive module instructions. The neural network uses this base for quick information retrieval when creating checklists, answering questions, and analyzing functionality.

IMPORTANT: You index ONLY instructions. Test cases and checklists are handled separately.

## Vault structure
Vault path: $VAULT

The vault has:
- MOC - Инструкции.md — map of content for all instructions, organized by module
- MOC - Модули.md — map of content for modules
- Modules/ — one file per module (Module - {Name}.md)
- Instructions/ — instruction files
- Test Cases/ — test cases (NOT your responsibility)

## Available modules

| Module | Slug | Package |
|--------|------|---------|
| HelpDesk | helpdesk | ithive.helpdesk |
| База знаний | knowledgebase | ithive.knowledgebase |
| Библиотека | library | ithive.library |
| Брендирование Битрикс24 | branding | ithive.changeportaldefaultheme |
| Геймификация | gamification | ithive.gamification |
| Главная страница | homepage | ithive.homepage |
| Интерактивные подсказки | hints | ithive.hints |
| Карта офиса + Бронирование | workplaces | ithive.workplaces |
| Корпоративный университет | university | ithive.ipr |
| Мультиязычность | multilang | ithive.b24multilanguage |
| Настройка уведомлений | notifications | ithive.imsettingsforall |
| Опросы | polls | ithive.polls |
| Оценка 360 | assessment360 | ithive.assessment360 |
| Управление целями. Дерево | goals-tree | ithive.goalsmanagement2 |
| Управление целями. Каскад | goals-cascade | ithive.goalsmanagement |
| Фото и видео галерея | mediagallery | ithive.mediagallery |

## Workflow

### 1. Analyze content

Determine:
- Module: by keywords, module name, package
- Topic: what specifically (authorization, CRUD, UI, etc.)
- Related modules: are other modules mentioned

### 2. Create or update file

Create/update file in Instructions/.
Filename: {Module} - {Topic}.md

### 3. Frontmatter (properties)

Always add:
---
title: \"{Module} - {Topic}\"
module: \"{Module}\"
type: instruction
version: \"\"
created: $TODAY
updated: $TODAY
tags:
  - type/instruction
  - module/{slug}
related: []
---

### 4. File structure

Required sections in the body:

# {Module} - {Topic}

**Модуль:** [[Module - {Module}]]

## Описание

## Ключевые функции

> List the main functions/scenarios. Critical for AI checklist generation.

- Function 1
- Function 2

## Предусловия

## Шаги

## Ожидаемый результат

## Граничные случаи

> Edge cases, limitations, known issues.

## Связанные документы

### 5. Wikilinks

In the body add:
- Link to module: [[Module - {Module}]]
- Links to related modules if mentioned

### 6. Update MOC

After creating/updating the file, update MOC - Инструкции.md.
Add wikilink to the new file in the corresponding module section.

### 7. Update Module file

If the module file does not yet have a link to the new instruction, add it to the 'Инструкции' section.

## Rules

- Always use wikilinks [[ ]] for connections
- Always add tags #module/{slug} and #type/instruction
- If module is unclear — choose the best match by context
- If document covers multiple modules — list all in 'related'
- NEVER delete existing files — only update them
- If a file already exists — UPDATE it, do NOT create a duplicate
- Index ONLY instructions (not test cases or checklists)"

            opencode run "$PROMPT" \
              --dir "$VAULT" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              2>&1 || echo "FAILED: $basename"

            rm -f "$VAULT/$basename"
          done

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index new instructions"
            git push
            echo "Pushed to knowledge base"
          fi
