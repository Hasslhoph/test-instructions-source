name: Index Instructions

on:
  push:
    branches: [main]
    paths: ['**/*.md', '.github/workflows/*']

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup opencode and run indexer
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_KEY }}
        run: |
          set -e

          # Setup agents
          mkdir -p ~/.config/opencode/agent
          cp "$GITHUB_WORKSPACE/vault/.opencode/agent/obsidian-indexer.md" ~/.config/opencode/agent/
          sed -i "s|/Users/.*/Documents/Obsidian|$GITHUB_WORKSPACE/vault|g" ~/.config/opencode/agent/obsidian-indexer.md

          # Setup Go provider auth
          mkdir -p ~/.local/share/opencode
          printf '{"opencode-go":{"type":"api","key":"%s"}}\n' "$OPENCODE_GO_API_KEY" > ~/.local/share/opencode/auth.json

          # Detect new files
          cd "$GITHUB_WORKSPACE/source"
          git fetch origin main --depth=2
          FILES=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.md' || true)

          if [ -z "$FILES" ]; then
            echo "No new .md files to process"
            exit 0
          fi

          # Index each file
          for file in $FILES; do
            full_path="$GITHUB_WORKSPACE/source/$file"
            [ -f "$full_path" ] || continue
            echo "=== Indexing: $file ==="
            npx --yes @opencode-ai/cli run \
              --agent obsidian-indexer \
              --file "$full_path" \
              --dir "$GITHUB_WORKSPACE/vault" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              "Index this instruction into the vault at $GITHUB_WORKSPACE/vault. Analyze the file, detect the module, create the file in Instructions/ with proper frontmatter and wikilinks, then update MOC - Инструкции.md and Modules/Module - {Name}.md."
          done

          # Commit and push
          cd "$GITHUB_WORKSPACE/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index: new instructions from Яна"
            git push
            echo "Pushed to knowledge base"
          else
            echo "No changes to commit"
          fi
