name: Index Instructions

on:
  push:
    paths:
      - '**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup
        run: |
          npm install -g @opencode-ai/cli
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH

      - name: Index via AI
        env:
          VAULT_PATH: ${{ github.workspace }}/vault
          SOURCE_PATH: ${{ github.workspace }}/source
        run: python3 ${{ github.workspace }}/source/indexer.py

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index new instructions"
            git push
            echo "Pushed to knowledge base"
          fi
