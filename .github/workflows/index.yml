        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Test
        run: echo "hello" && ls "$GITHUB_WORKSPACE/vault/.opencode/agent/" && echo "OK"
