name: Index Instructions

on:
  push:
    paths:
      - '**.md'

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - name: Install opencode
        run: |
          curl -sL "https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64.tar.gz" -o /tmp/opencode.tar.gz
          tar -xzf /tmp/opencode.tar.gz -C /tmp
          mkdir -p ~/.opencode/bin
          mv /tmp/opencode ~/.opencode/bin/opencode
          chmod +x ~/.opencode/bin/opencode
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Auth
        run: |
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH

      - name: Index new instructions
        shell: bash
        run: |
          set -e
          VAULT="${{ github.workspace }}/vault"
          SOURCE="${{ github.workspace }}/source"

          # Find new .md files not already in vault
          for md in $(find "$SOURCE" -name '*.md' -not -path '*/.git/*'); do
            rel=$(echo "$md" | sed "s|$SOURCE/||")
            basename=$(basename "$md")

            # Skip if filename already exists in vault Instructions/
            if ls "$VAULT/Instructions/"*"$basename" 2>/dev/null | head -1 | grep -q .; then
              echo "Skip $rel (already in vault)"
              continue
            fi

            echo "=== Index: $rel ==="

            # Copy file into vault (avoid external_directory permission issue)
            cp "$md" "$VAULT/$basename"

            # Run opencode with obsidian-indexer prompt
            opencode run --dir "$VAULT" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              "You are an Obsidian vault indexer. Index the file $basename.

Core rules:
- Determine which module the file belongs to
- If a file with the same topic already exists in Instructions/ — UPDATE it (merge new info, add sections, improve)
- If it does NOT exist — CREATE new file
- Always add wikilinks to related modules and instructions

Available modules:
- helpdesk: HelpDesK (ithive.helpdesk)
- knowledgebase: База знаний (ithive.knowledgebase)
- library: Библиотека (ithive.library)
- branding: Брендирование Битрикс24 (ithive.changeportaldefaultheme)
- gamification: Геймификация (ithive.gamification)
- homepage: Главная страница (ithive.homepage)
- hints: Интерактивные подсказки (ithive.hints)
- workplaces: Карта офиса + Бронирование (ithive.workplaces)
- university: Корпоративный университет (ithive.ipr)
- multilang: Мультиязычность (ithive.b24multilanguage)
- notifications: Настройка уведомлений (ithive.imsettingsforall)
- polls: Опросы (ithive.polls)
- assessment360: Оценка 360 (ithive.assessment360)
- goals-tree: Управление целями. Дерево (ithive.goalsmanagement2)
- goals-cascade: Управление целями. Каскад (ithive.goalsmanagement)
- mediagallery: Фото и видео галерея (ithive.mediagallery)

Filename format: Instructions/{Module} - {Topic}.md

Frontmatter:
---
title: \"{Module} - {Topic}\"
module: \"{Module}\"
type: instruction
version: \"\"
created: $(date +%Y-%m-%d)
updated: $(date +%Y-%m-%d)
tags:
  - type/instruction
  - module/{slug}
related: []
---

Body structure:
# {Module} - {Topic}

**Модуль:** [[Module - {Module}]]

## Описание
## Ключевые функции
## Предусловия
## Шаги
## Ожидаемый результат
## Граничные случаи
## Связанные документы
- [[Module - {Module}]]

After creating/updating the file:
1. Update MOC - Инструкции.md — add wikilink to the correct module section
2. Update Modules/Module - {Name}.md — add wikilink to Инструкции section

If module is unclear, choose best match by context."
          echo "EXIT: $?"
          rm -f "$VAULT/$basename"
          done

      - name: Commit and push
        run: |
          cd "${{ github.workspace }}/vault"
          git config user.name "QA Indexer Bot"
          git config user.email "bot@qa-indexer"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto-index new instructions"
            git push
            echo "Pushed to knowledge base"
          else
            echo "No changes"
          fi
