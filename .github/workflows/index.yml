name: Index Instructions

on: [push]

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: Hasslhoph/test-qa-knowledge-base
          token: ${{ secrets.PAT_KB }}
          path: vault

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup
        run: |
          npm install -g @opencode-ai/cli || echo "npm ok"
          
          # Agent
          mkdir -p ~/.config/opencode/agent
          cp "${{ github.workspace }}/vault/.opencode/agent/obsidian-indexer.md" ~/.config/opencode/agent/ || echo "cp ok"
          sed -i "s|/Users/.*/Documents/Obsidian|${{ github.workspace }}/vault|g" ~/.config/opencode/agent/obsidian-indexer.md
          echo "Agent vault path:"
          grep "Vault location" ~/.config/opencode/agent/obsidian-indexer.md
          
          # Auth
          mkdir -p ~/.local/share/opencode
          cat > ~/.local/share/opencode/auth.json << ENDAUTH
          {"opencode-go":{"type":"api","key":"${{ secrets.OPENCODE_GO_KEY }}"}}
          ENDAUTH
          echo "Auth file:"
          head -c 60 ~/.local/share/opencode/auth.json

      - name: Index
        run: |
          set +e
          SRCDIR="${{ github.workspace }}/source"
          VAULTDIR="${{ github.workspace }}/vault"
          
          # Find first .md file
          for md in $(find "$SRCDIR" -name '*.md' -not -path '*/.git/*' -not -path '*/.github/*' | head -1); do
            echo "File: $md"
            ls -la "$md"
            
            # Read file content
            CONTENT=$(cat "$md")
            
            # Run opencode - without subagent, just direct AI instructions
            echo "CONTENT: ${CONTENT:0:50}..."
            
            opencode run \
              --dir "$VAULTDIR" \
              --dangerously-skip-permissions \
              --model opencode-go/deepseek-v4-flash \
              "Create a file in $VAULTDIR/Instructions/ named TestModule-TestInstruction.md with the following content:
---
title: TestModule - TestInstruction
module: TestModule
type: instruction
tags:
  - type/instruction
  - module/test
---

# Test Instruction

This is a test" 2>&1
            echo "EXIT: $?"
          done

      - name: Check results
        run: |
          cd "${{ github.workspace }}/vault"
          echo "=== New files ==="
          find Instructions/ -name '*Test*' 2>/dev/null
          git status --short
